services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-prod-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  backend:
    build:
      context: ./bean-beacon-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      MONGODB_URI: mongodb://mongo:27017/bean-beacon
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your production environment}
      JWT_EXPIRE: 7d
      PORT: 3000
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      OVERPASS_API_URL: https://overpass-api.de/api/interpreter
      NOMINATIM_API_URL: https://nominatim.openstreetmap.org
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

  frontend:
    build:
      context: ./bean-beacon-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mongo-prod-data:

networks:
  app-network:
    driver: bridge
