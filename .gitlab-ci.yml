stages:
  - validate
  - test
  - security
  - build

default:
  tags:
    - bean-beacon   # matches your self-hosted runner's tag — applies to every job below

variables:
  BACKEND_DIR: bean-beacon-backend
  FRONTEND_DIR: bean-beacon-frontend

# --- VALIDATE: typecheck backend, lint + typecheck frontend ---

backend:typecheck:
  stage: validate
  cache:
    key: backend-npm
    paths:
      - $BACKEND_DIR/node_modules
  script:
    - cd $BACKEND_DIR
    - npm ci
    - npm run build   # runs tsc, fails the job on any type error

frontend:lint:
  stage: validate
  cache:
    key: frontend-npm
    paths:
      - $FRONTEND_DIR/node_modules
  script:
    - cd $FRONTEND_DIR
    - npm ci
    - npm run lint

frontend:build:
  stage: validate
  cache:
    key: frontend-npm
    paths:
      - $FRONTEND_DIR/node_modules
  script:
    - cd $FRONTEND_DIR
    - npm ci
    - npm run build

# --- TEST: backend unit tests (vitest). Frontend has no test script yet. ---

backend:test:
  stage: test
  cache:
    key: backend-npm
    paths:
      - $BACKEND_DIR/node_modules
  script:
    - cd $BACKEND_DIR
    - npm ci
    - npm test -- run   # vitest run (non-watch mode in CI)

# --- SECURITY: dependency audit + secret scanning ---
# Later stages only start if earlier ones pass — this is what satisfies the
# guide's "a broken test prevents the pipeline from deploying a release".

backend:audit:
  stage: security
  script:
    - cd $BACKEND_DIR
    - npm audit --audit-level=high || true   # report only, don't hard-fail on transitive deps you don't control

frontend:audit:
  stage: security
  script:
    - cd $FRONTEND_DIR
    - npm audit --audit-level=high || true

gitleaks:
  stage: security
  script:
    - docker run --rm -v "${PWD}:/path" zricethezav/gitleaks:latest detect --source="/path" --verbose --redact
  allow_failure: false   # a real secret leak should block the pipeline

# --- BUILD: build both Docker images (not pushed yet — that's Étape 4) ---

backend:docker-build:
  stage: build
  script:
    - docker build -t bean-beacon-backend:$CI_COMMIT_SHORT_SHA -f $BACKEND_DIR/Dockerfile.dev $BACKEND_DIR
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

frontend:docker-build:
  stage: build
  script:
    - docker build -t bean-beacon-frontend:$CI_COMMIT_SHORT_SHA -f $FRONTEND_DIR/Dockerfile.dev $FRONTEND_DIR
  rules:
    - if: $CI_COMMIT_BRANCH == "main"